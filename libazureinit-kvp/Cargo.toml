[package]
name = "libazureinit-kvp"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
repository = "https://github.com/Azure/azure-init/"
homepage = "https://github.com/Azure/azure-init/"
license = "MIT"
description = "Hyper-V KVP (Key-Value Pair) storage library for azure-init."

[dependencies]
base64 = "0.23"
clap = { version = "4.5.21", features = ["derive"] }
csv = "1"
flate2 = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.96"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting", "macros"] }
tracing = "0.1.40"
uuid.workspace = true

[dev-dependencies]
rstest = { version = "0.28", default-features = false }
tempfile = "3"

[lib]
name = "libazureinit_kvp"
path = "src/lib.rs"
