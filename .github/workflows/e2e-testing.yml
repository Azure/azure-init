name: "E2E Testing"
permissions:
  contents: read

on:
  push:
    branches:
      - main
  schedule:
    # 19:00 UTC is 11 AM PST
    - cron: "0 19 * * *"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  e2e-test:
    strategy:
      fail-fast: false
      matrix:
        container:
          - ubuntu:26.04
          - ubuntu:24.04
          - debian:13
          - mcr.microsoft.com/azurelinux/base/core:3.0

    name: Testinit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test startup script
        run: python3 -B -m unittest discover -s testinit/tests -v
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            network=host

      - name: Make start-all.sh executable
        run: chmod +x testinit/start-all.sh testinit/stop-all.sh

      - name: Build testing server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: testinit/testing-server
          tags: testinit-testing-server
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=testinit-testing-server
          # All matrix jobs use the same mock image; only one exports its cache.
          cache-to: ${{ matrix.container == 'ubuntu:24.04' && 'type=gha,scope=testinit-testing-server,mode=max' || '' }}

      - name: Build provisioning agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: testinit/Dockerfile
          build-args: BASE_IMAGE=${{ matrix.container }}
          tags: testinit-provisioning-agent
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=testinit-agent-${{ matrix.container }}
          cache-to: type=gha,scope=testinit-agent-${{ matrix.container }},mode=max
      
      - name: Run E2E tests
        run: |
          pushd testinit
          echo "Starting E2E test environment with base image: ${{ matrix.container }}"
          ./start-all.sh "${{ matrix.container }}" --no-build
        
      - name: Check service health
        run: |
          echo "Checking if services are running..."
          docker ps -a

      - name: Print provisioning agent logs
        if: always()
        run: |
          pushd testinit
          # Capture logs to a file (and also print them). Ignore non-zero exit status so checks still run.
          docker compose logs provisioning-agent > provisioning_agent_logs.txt 2>&1 || true
          cat provisioning_agent_logs.txt
          # Fail only if a single line contains both "azure-init" and "failed"/"failure" (case-insensitive).
          if grep -i 'azure-init' provisioning_agent_logs.txt | grep -Ei 'failed|failure' >/dev/null; then
            echo "ERROR: provisioning-agent logs contain a line with 'azure-init' and failure indicators."
            exit 1
          fi

      - name: Print testing server logs
        if: always()
        run: |
          pushd testinit/testing-server
          docker compose logs testing-server || echo "No testing-server logs yet"
          popd

      - name: Output KVP telemetry
        if: always()
        run: |
          docker exec azure-testing-server cat /tmp/testinit.kvp_pool_1

      - name: Output Azure-init log
        if: always()
        run: |
          docker exec azureinit-provisioning-agent cat /var/log/azure-init.log

      - name: Cleanup - Stop all services
        if: always()
        working-directory: testinit
        run: |
          echo "Cleaning up services..."
          ./stop-all.sh && echo "Cleanup completed"
