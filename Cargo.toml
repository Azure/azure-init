[package]
name = "azure-init"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
repository = "https://github.com/Azure/azure-init/"
homepage = "https://github.com/Azure/azure-init/"
license = "MIT"
readme = "README.md"
description = "A reference implementation for provisioning Linux VMs on Azure."
build = "build.rs"

[dependencies]
libazureinit-kvp = { path = "libazureinit-kvp", version = "0.1.0" }
exitcode = "1.1.2"
anyhow = "1.0.81"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.40"
clap = { version = "4.5.21", features = ["derive", "cargo", "env"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
serde_json = "1.0.96"
uuid = { version = "1.3", features = ["v4"] }

sysinfo = "0.38"

[dev-dependencies]
assert_cmd = "2.0.16"
predicates = "3.1.2"
predicates-core = "1.0.8"
predicates-tree = "1.0.11"
rstest = { version = "0.27", default-features = false }
tempfile = "3.3.0"

[dependencies.libazureinit]
path = "libazureinit"
version = "0.1.0"

[profile.dev]
incremental = true

[[bin]]
name = "azure-init"
path = "src/main.rs"

[[bin]]
name = "functional_tests"
path = "tests/functional_tests.rs"

[workspace]
members = [
    "libazureinit",
    "libazureinit-kvp",
]

[workspace.package]
rust-version = "1.89"

[features]
passwd = []
hostnamectl = []
useradd = []

systemd_linux = ["passwd", "hostnamectl", "useradd"]

default = ["systemd_linux"]
